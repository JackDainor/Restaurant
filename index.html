<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurante</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#ea580c"><link rel="icon" href="/icon-192.png">
<style>
:root{--o:#ea580c;--bg:#fff7ed;--c:#fff;--t:#1c1917;--m:#78716c;--b:#e7e5e4}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--c:#292524;--t:#fafaf9;--m:#a8a29e;--b:#44403c}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
.wrap{max-width:1000px;margin:auto;padding:0 14px 120px}
.ban{height:200px;background:#444 center/cover}.hd{background:var(--c);margin:-40px 14px 0;border-radius:20px;padding:46px 16px 14px;text-align:center;position:relative;max-width:972px;margin-inline:auto}
.logo{width:76px;height:76px;border-radius:50%;background:var(--o) center/cover;border:4px solid var(--c);position:absolute;top:-38px;left:calc(50% - 38px)}
h1{margin:0;font-size:22px}.info{color:var(--m);font-size:14px;margin-top:6px}.ok{color:#16a34a;font-weight:700}.no{color:#dc2626;font-weight:700}
.cats{display:flex;gap:8px;overflow:auto;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.cats button{white-space:nowrap;border:1px solid var(--b);background:var(--c);color:var(--t);padding:8px 14px;border-radius:99px;cursor:pointer}.cats .on{background:var(--o);color:#fff;border-color:var(--o)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.d{background:var(--c);border-radius:16px;display:flex;gap:10px;padding:10px;border:1px solid var(--b)}
.d .im{width:92px;height:92px;border-radius:12px;background:#d6d3d1 center/cover;flex:none}.d h3{margin:0 0 4px;font-size:16px}.d p{margin:0;font-size:13px;color:var(--m)}
.d .r{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:700}
.add{background:var(--o);color:#fff;border:0;border-radius:99px;width:34px;height:34px;font-size:20px;cursor:pointer}
.fab{position:fixed;right:16px;width:56px;height:56px;border-radius:50%;border:0;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 14px #0004;text-decoration:none;display:flex;align-items:center;justify-content:center}
#wa{background:#25d366;bottom:90px}
.bar{position:fixed;left:12px;right:84px;bottom:16px;background:var(--o);color:#fff;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer;max-width:600px}
.md{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.md.on{display:flex}
.box{background:var(--c);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.box h2{margin:0 0 10px}.ln{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--b);background:var(--bg);color:var(--t);cursor:pointer}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font-size:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.seg button{padding:10px 4px;border:2px solid var(--b);background:var(--bg);color:var(--t);border-radius:12px;cursor:pointer;font-size:13px}.seg .on{border-color:var(--o);color:var(--o);font-weight:700}
.tot{display:flex;justify-content:space-between;margin:4px 0}.big{font-size:20px;font-weight:800}
.go{width:100%;background:var(--o);color:#fff;border:0;padding:15px;border-radius:14px;font-size:17px;font-weight:700;margin-top:10px;cursor:pointer}
</style></head><body>
<div class="ban" id="ban"></div>
<div class="hd"><div class="logo" id="logo"></div><h1 id="nm">…</h1><div class="info" id="inf"></div></div>
<div class="wrap"><div class="cats" id="cats"></div><div class="grid" id="grid"></div></div>
<a class="fab" id="wa" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
<button class="bar" id="bar" style="display:none" onclick="openCart()"><span id="bn">🛒 0</span><span id="bt"></span></button>
<div class="md" id="md" onclick="if(event.target==this)this.classList.remove('on')"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s),R=n=>'R$ '+Number(n).toFixed(2).replace('.',','),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=[],S={},C=JSON.parse(localStorage.c||'{}'),cat='Todos',T='delivery',P='pix';
const save=()=>{localStorage.c=JSON.stringify(C);bar()};
async function load(){const r=await(await fetch('/api/api?a=menu')).json();M=r.dishes;S=r.s;
document.title=S.name;$('#nm').textContent=S.name;$('#ban').style.backgroundImage=S.banner?`url("${S.banner}")`:'linear-gradient(135deg,#ea580c,#f59e0b)';
if(S.logo)$('#logo').style.backgroundImage=`url("${S.logo}")`;
$('#inf').innerHTML=(S.open=='1'?'<span class="ok">Abierto</span>':'<span class="no">Cerrado</span>')+` • ${E(S.hours)} • Mínimo ${R(S.min)}`;
$('#wa').href='https://wa.me/'+S.whatsapp.replace(/\D/g,'');render()}
function render(){const cs=['Todos',...new Set(M.map(d=>d.cat))];
$('#cats').innerHTML=cs.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${E(c).replace(/'/g,'')}';render()">${E(c)}</button>`).join('');
$('#grid').innerHTML=M.filter(d=>cat=='Todos'||d.cat==cat).map(d=>`<div class="d"><div class="im" style="${d.img?`background-image:url('${E(d.img)}')`:''}"></div><div style="flex:1"><h3>${E(d.name)}</h3><p>${E(d.descr)}</p><div class="r"><span>${R(d.price)}</span><button class="add" onclick="add(${d.id},1)">+</button></div></div></div>`).join('')||'<p>Aún no hay platos.</p>';bar()}
const add=(i,n)=>{C[i]=(C[i]||0)+n;if(C[i]<=0)delete C[i];save();if($('#md').classList.contains('on'))openCart()};
const lines=()=>Object.entries(C).map(([i,q])=>({d:M.find(x=>x.id==i),q})).filter(x=>x.d);
const sub=()=>lines().reduce((a,l)=>a+l.d.price*l.q,0),cnt=()=>lines().reduce((a,l)=>a+l.q,0);
function bar(){const n=cnt();$('#bar').style.display=n?'flex':'none';$('#bn').textContent='🛒 Ver carrito ('+n+')';$('#bt').textContent=R(sub())}
function openCart(){const L=lines();if(!L.length){$('#md').classList.remove('on');return}
const fee=T=='delivery'?+S.fee:0;
$('#box').innerHTML=`<h2>Tu pedido</h2>${L.map(l=>`<div class="ln"><span>${E(l.d.name)}<br><small>${R(l.d.price)}</small></span><span class="q"><button onclick="add(${l.d.id},-1)">−</button> ${l.q} <button onclick="add(${l.d.id},1)">+</button></span></div>`).join('')}
<div class="seg">${[['local','🍽️ Aquí'],['recoger','🛍️ Recoger'],['delivery','🛵 Delivery']].map(([k,v])=>`<button class="${T==k?'on':''}" onclick="T='${k}';openCart()">${v}</button>`).join('')}</div>
<input id="fn" placeholder="Tu nombre" value="${E(localStorage.n||'')}"><input id="fp" placeholder="WhatsApp / teléfono" inputmode="tel" value="${E(localStorage.p||'')}">
${T=='delivery'?'<input id="fa" placeholder="Dirección completa" value="'+E(localStorage.a||'')+'">':T=='local'?'<input id="ft" placeholder="Número de mesa" inputmode="numeric">':''}
<div class="seg">${[['pix','Pix'],['debito','Débito'],['credito','Crédito']].map(([k,v])=>`<button class="${P==k?'on':''}" onclick="P='${k}';openCart()">${v}</button>`).join('')}</div>
<small>Pago al ${T=='delivery'?'recibir':'retirar/en el local'}. ${P=='pix'?'Te enviaremos el Pix por WhatsApp.':''}</small>
<div class="tot" style="margin-top:10px"><span>Subtotal</span><span>${R(sub())}</span></div>${fee?`<div class="tot"><span>Delivery</span><span>${R(fee)}</span></div>`:''}
<div class="tot big"><span>Total</span><span>${R(sub()+fee)}</span></div><button class="go" onclick="send()">Confirmar pedido</button>`;
$('#md').classList.add('on')}
async function send(){const g=i=>$(i)?.value.trim()||'';const name=g('#fn'),phone=g('#fp'),address=g('#fa'),table=g('#ft');
if(!name||!phone)return alert('Completa nombre y teléfono');localStorage.n=name;localStorage.p=phone;if(address)localStorage.a=address;
const body={name,phone,address,table,type:T,pay:P,items:lines().map(l=>({id:l.d.id,q:l.q}))};
const r=await fetch('/api/api?a=order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();
if(!r.ok)return alert(j.error);
const txt=`Hola! Pedido #${j.id}\n`+lines().map(l=>`${l.q}x ${l.d.name}`).join('\n')+`\nTotal: ${R(j.total)}\nTipo: ${T}\nPago: ${P}\n${name}`;
C={};save();$('#box').innerHTML=`<h2>✅ ¡Pedido #${j.id} enviado!</h2><p>Total ${R(j.total)}. El restaurante ya lo recibió.</p><a class="go" style="display:block;text-align:center;text-decoration:none" target="_blank" href="https://wa.me/${S.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(txt)}">Enviar resumen por WhatsApp</a><button class="go" style="background:#78716c" onclick="$('#md').classList.remove('on')">Cerrar</button>`}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');load();
</script></body></html>
