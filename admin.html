<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><meta name="robots" content="noindex">
<style>
:root{--o:#f97316;--bg:#10100f;--c:#1b1917;--t:#fffaf5;--m:#b6aaa0;--b:#39332e;--soft:#28231f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top,#292019 0%,var(--bg) 55%);color:var(--t);min-height:100vh}
.w{max-width:1040px;margin:auto;padding:22px 16px 60px}
#app:before{content:"RESTAURANT · PANEL DE CONTROL";display:block;color:#fb923c;font-size:11px;font-weight:900;letter-spacing:.18em;margin:4px 0 18px}
nav{display:flex;gap:8px;position:sticky;top:0;background:#10100fee;backdrop-filter:blur(14px);padding:12px 0 16px;z-index:3;border-bottom:1px solid #ffffff10;margin-bottom:18px}
nav button{flex:1;padding:13px 10px;border:1px solid var(--b);border-radius:13px;background:var(--c);color:var(--m);font-weight:800;cursor:pointer;font-size:13px}
nav .on{background:linear-gradient(110deg,#fb923c,#ea580c);border-color:transparent;color:#211006;box-shadow:0 8px 20px #f9731625}
.card{background:linear-gradient(145deg,#211f1d,#191817);border-radius:18px;padding:18px;margin-bottom:13px;border:1px solid #ffffff13;box-shadow:0 10px 26px #0002}
.card b{letter-spacing:-.01em}.card> b{font-size:17px}
input,select,textarea{width:100%;padding:13px 14px;margin:6px 0;border:1px solid var(--b);border-radius:12px;background:#28231f;color:var(--t);font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px #f9731620}
label{display:block;margin:10px 0 5px;color:#f2e8df;font-weight:650}label small{display:block;color:#fb923c;font-size:11px;letter-spacing:.05em;margin-bottom:4px}
button{transition:transform .18s,filter .18s}button:active{transform:scale(.97)}button.p{background:linear-gradient(110deg,#fb923c,#ea580c);color:#211006;border:0;padding:12px 17px;border-radius:12px;cursor:pointer;font-weight:900;box-shadow:0 7px 18px #f9731628}button.s{background:#2a2622;color:#eee3da;border:1px solid var(--b);padding:9px 12px;border-radius:10px;cursor:pointer;margin:3px;font-weight:650}
.tag{display:inline-flex;align-items:center;padding:5px 10px;border-radius:99px;font-size:11px;background:#f9731618;color:#fdba74;border:1px solid #f9731630;margin:5px 4px 2px 0;font-weight:750}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.row>div:first-child{min-width:0}.row>div:last-child{display:flex;flex-wrap:wrap;justify-content:flex-end}
.preview{display:block;max-width:100%;max-height:210px;object-fit:cover;border-radius:14px;margin:10px 0;border:1px solid var(--b);background:var(--soft)}
.filehint{font-size:12px;color:var(--m);display:block;margin:4px 0 10px;line-height:1.5}
a{color:#fdba74}#app>p{color:var(--m)}
@media(max-width:560px){.w{padding:14px 10px 40px}nav{gap:5px}nav button{padding:12px 4px;font-size:11px;border-radius:11px}.card{padding:14px;border-radius:15px}.row{align-items:flex-start}.row>div:last-child{max-width:120px}button.s{padding:8px 9px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head><body><div class="w" id="app"></div><script>
const $=s=>document.querySelector(s),R=n=>'R$ '+Number(n).toFixed(2).replace('.',','),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let K=sessionStorage.k||'',tab='orders',D=[],S={},O=[],ed=null,dishPhoto='',bannerPhoto='',logoPhoto='';
const api=async(a,b)=>{const r=await fetch('/api/api?a='+a,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-admin':K},body:b?JSON.stringify(b):undefined});if(r.status==401){sessionStorage.k=K='';login();throw 0}return r.json()};
function login(){$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:18vh auto"><h2 style="font-size:25px;margin:0 0 6px">🔐 Bienvenido al panel</h2><p style="color:var(--m);font-size:13px;margin:0 0 16px">Administra pedidos, platos y datos de tu restaurante.</p><input id="pw" type="password" placeholder="Clave"><button class="p" style="width:100%" onclick="K=$('#pw').value;api('login',{}).then(()=>{sessionStorage.k=K;start()})">Entrar</button></div>`}
async function start(){const m=await api('menu');D=m.dishes;S=m.s;draw()}
const ST=['nuevo','preparando','listo','en camino','entregado','cancelado'],TY={local:'🍽️ En local',recoger:'🛍️ Recoger',delivery:'🛵 Delivery'};
async function draw(){let h=`<nav>${[['orders','📋 Pedidos'],['dishes','🍔 Platos'],['set','⚙️ Ajustes']].map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';draw()">${v}</button>`).join('')}</nav>`;
if(tab=='orders'){O=await api('orders');h+=O.map(o=>`<div class="card"><div class="row"><b>#${o.id} · ${E(o.name)}</b><b>${R(o.total)}</b></div><span class="tag">${TY[o.type]}</span><span class="tag">${E(o.pay)}</span><span class="tag">${E(o.status)}</span><div style="color:var(--m);font-size:13px;margin:6px 0">${(o.items||[]).map(i=>i.q+'x '+E(i.name)).join(' · ')}<br>📍 ${E(o.address)} · <a href="https://wa.me/${o.phone.replace(/\D/g,'')}" target="_blank">${E(o.phone)}</a></div>${ST.map(s=>`<button class="s" style="${o.status==s?'background:var(--o);color:#fff':''}" onclick="api('status',{id:${o.id},status:'${s}'}).then(draw)">${s}</button>`).join('')}</div>`).join('')||'<p>Sin pedidos aún.</p>';clearTimeout(window.tm);window.tm=setTimeout(()=>tab=='orders'&&draw(),15000)}
if(tab=='dishes'){const e=ed||{};dishPhoto='';h+=`<div class="card"><b>${e.id?'Editar':'Nuevo'} plato</b><input id="n" placeholder="Nombre" value="${E(e.name)}"><input id="d" placeholder="Descripción" value="${E(e.descr)}"><input id="p" type="number" step="0.01" placeholder="Precio" value="${e.price??''}"><input id="c" placeholder="Categoría" value="${E(e.cat||'Platos')}"><label><small>Foto del plato</small><input id="dishFile" type="file" accept="image/*" capture="environment" onchange="readPhoto(this,'dish')"></label><span class="filehint">Elige una imagen desde la galería o toma una foto. ${e.img?'Si no seleccionas otra, se conserva la foto actual.':''}</span><img class="preview" id="dishPreview" src="${E(e.img)}" ${e.img?'':'hidden'}><button class="p" onclick="sd()">Guardar</button> ${e.id?'<button class="s" onclick="ed=null;draw()">Cancelar</button>':''}</div>`+D.map(x=>`<div class="card row"><div><b>${E(x.name)}</b> ${x.active?'':'<span class="tag">oculto</span>'}<br><small>${E(x.cat)} · ${R(x.price)}</small></div><div><button class="s" onclick="ed=D.find(z=>z.id==${x.id});draw();scrollTo(0,0)">✏️</button><button class="s" onclick="tg(${x.id})">👁️</button><button class="s" onclick="confirm('¿Borrar?')&&api('deldish',{id:${x.id}}).then(start)">🗑️</button></div></div>`).join('')}
if(tab=='set'){bannerPhoto='';logoPhoto='';const f=[['name','Nombre del restaurante'],['whatsapp','WhatsApp con código país (5511999999999)'],['fee','Costo de delivery (R$)'],['min','Pedido mínimo (R$)'],['hours','Horario de atención'],['address','Dirección / ubicación del restaurante'],['deliveryText','Información de delivery (zonas, tiempos, costo)']];
h+=`<div class="card">${f.map(([k,l])=>`<label><small>${l}</small><input id="s_${k}" value="${E(S[k])}"></label>`).join('')}<label><small>Foto del banner</small><input id="bannerFile" type="file" accept="image/*" onchange="readPhoto(this,'banner')"></label><span class="filehint">Selecciona desde la galería. Si no cambias la imagen, se conserva la actual.</span><img class="preview" id="bannerPreview" src="${E(S.banner)}" ${S.banner?'':'hidden'}><label><small>Logo del restaurante</small><input id="logoFile" type="file" accept="image/*" onchange="readPhoto(this,'logo')"></label><img class="preview" id="logoPreview" src="${E(S.logo)}" ${S.logo?'':'hidden'}><label><small>Delivery</small><select id="s_delivery"><option value="1" ${S.delivery!='0'?'selected':''}>Disponible</option><option value="0" ${S.delivery=='0'?'selected':''}>No disponible</option></select></label><label><small>Estado</small><select id="s_open"><option value="1" ${S.open=='1'?'selected':''}>Abierto (recibe pedidos)</option><option value="0" ${S.open=='0'?'selected':''}>Cerrado</option></select></label><button class="p" onclick="ss()">Guardar ajustes</button></div>`}
$('#app').innerHTML=h}
async function readPhoto(input,kind){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Selecciona un archivo de imagen.');if(file.size>12*1024*1024)return alert('La imagen debe pesar menos de 12 MB.');try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=data});const max=kind==='dish'?900:1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const result=canvas.toDataURL('image/webp',0.78);if(kind==='dish'){dishPhoto=result;$('#dishPreview').src=result;$('#dishPreview').hidden=false}else if(kind==='banner'){bannerPhoto=result;$('#bannerPreview').src=result;$('#bannerPreview').hidden=false}else{logoPhoto=result;$('#logoPreview').src=result;$('#logoPreview').hidden=false}}catch(e){alert('No se pudo leer esa imagen. Prueba con otra.')}}
const sd=async()=>{await api('dish',{id:ed?.id,name:$('#n').value,descr:$('#d').value,price:$('#p').value,cat:$('#c').value,img:dishPhoto||ed?.img||'',active:ed?ed.active:true});ed=null;start()};
const tg=async i=>{const x=D.find(z=>z.id==i);await api('dish',{...x,active:!x.active});start()};
const ss=async()=>{const b={};['name','whatsapp','fee','min','hours','address','deliveryText','open','delivery'].forEach(k=>b[k]=$('#s_'+k).value);b.banner=bannerPhoto||S.banner||'';b.logo=logoPhoto||S.logo||'';await api('settings',b);start();alert('Guardado')};
K?start().catch(()=>{}):login();
</script></body></html>
