<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><meta name="robots" content="noindex">
<style>
:root{--o:#ea580c;--bg:#f5f5f4;--c:#fff;--t:#1c1917;--m:#78716c;--b:#e7e5e4}@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--c:#292524;--t:#fafaf9;--m:#a8a29e;--b:#44403c}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}.w{max-width:900px;margin:auto;padding:12px}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:3}nav button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--c);color:var(--t);font-weight:600;cursor:pointer}nav .on{background:var(--o);color:#fff}
.card{background:var(--c);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--b)}
input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:15px}
button.p{background:var(--o);color:#fff;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}button.s{background:var(--bg);color:var(--t);border:1px solid var(--b);padding:8px 10px;border-radius:8px;cursor:pointer;margin:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bg);margin-right:4px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
</style></head><body><div class="w" id="app"></div><script>
const $=s=>document.querySelector(s),R=n=>'R$ '+Number(n).toFixed(2).replace('.',','),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let K=sessionStorage.k||'',tab='orders',D=[],S={},O=[],ed=null;
const api=async(a,b)=>{const r=await fetch('/api/api?a='+a,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-admin':K},body:b?JSON.stringify(b):undefined});if(r.status==401){sessionStorage.k=K='';login();throw 0}return r.json()};
function login(){$('#app').innerHTML=`<div class="card" style="max-width:340px;margin:20vh auto"><h2>🔐 Admin</h2><input id="pw" type="password" placeholder="Clave"><button class="p" style="width:100%" onclick="K=$('#pw').value;api('login',{}).then(()=>{sessionStorage.k=K;start()})">Entrar</button></div>`}
async function start(){const m=await api('menu');D=m.dishes;S=m.s;draw()}
const ST=['nuevo','preparando','listo','en camino','entregado','cancelado'],TY={local:'🍽️ En local',recoger:'🛍️ Recoger',delivery:'🛵 Delivery'};
async function draw(){let h=`<nav>${[['orders','📋 Pedidos'],['dishes','🍔 Platos'],['set','⚙️ Ajustes']].map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';draw()">${v}</button>`).join('')}</nav>`;
if(tab=='orders'){O=await api('orders');h+=O.map(o=>`<div class="card"><div class="row"><b>#${o.id} · ${E(o.name)}</b><b>${R(o.total)}</b></div><span class="tag">${TY[o.type]}</span><span class="tag">${E(o.pay)}</span><span class="tag">${E(o.status)}</span><div style="color:var(--m);font-size:13px;margin:6px 0">${(o.items||[]).map(i=>i.q+'x '+E(i.name)).join(' · ')}<br>📍 ${E(o.address)} · <a href="https://wa.me/${o.phone.replace(/\D/g,'')}" target="_blank">${E(o.phone)}</a></div>${ST.map(s=>`<button class="s" style="${o.status==s?'background:var(--o);color:#fff':''}" onclick="api('status',{id:${o.id},status:'${s}'}).then(draw)">${s}</button>`).join('')}</div>`).join('')||'<p>Sin pedidos aún.</p>';clearTimeout(window.tm);window.tm=setTimeout(()=>tab=='orders'&&draw(),15000)}
if(tab=='dishes'){const e=ed||{};h+=`<div class="card"><b>${e.id?'Editar':'Nuevo'} plato</b><input id="n" placeholder="Nombre" value="${E(e.name)}"><input id="d" placeholder="Descripción" value="${E(e.descr)}"><input id="p" type="number" step="0.01" placeholder="Precio" value="${e.price??''}"><input id="c" placeholder="Categoría" value="${E(e.cat||'Platos')}"><input id="i" placeholder="URL de la foto" value="${E(e.img)}"><button class="p" onclick="sd()">Guardar</button> ${e.id?'<button class="s" onclick="ed=null;draw()">Cancelar</button>':''}</div>`+D.map(x=>`<div class="card row"><div><b>${E(x.name)}</b> ${x.active?'':'<span class="tag">oculto</span>'}<br><small>${E(x.cat)} · ${R(x.price)}</small></div><div><button class="s" onclick="ed=D.find(z=>z.id==${x.id});draw();scrollTo(0,0)">✏️</button><button class="s" onclick="tg(${x.id})">👁️</button><button class="s" onclick="confirm('¿Borrar?')&&api('deldish',{id:${x.id}}).then(start)">🗑️</button></div></div>`).join('')}
if(tab=='set'){const f=[['name','Nombre del restaurante'],['whatsapp','WhatsApp con código país (5511999999999)'],['fee','Costo de delivery (R$)'],['min','Pedido mínimo (R$)'],['hours','Texto de horario (ej: Abierto hasta las 20:20)'],['banner','URL del banner'],['logo','URL del logo']];
h+=`<div class="card">${f.map(([k,l])=>`<label><small>${l}</small><input id="s_${k}" value="${E(S[k])}"></label>`).join('')}<label><small>Estado</small><select id="s_open"><option value="1" ${S.open=='1'?'selected':''}>Abierto (recibe pedidos)</option><option value="0" ${S.open=='0'?'selected':''}>Cerrado</option></select></label><button class="p" onclick="ss()">Guardar ajustes</button></div>`}
$('#app').innerHTML=h}
const sd=async()=>{await api('dish',{id:ed?.id,name:$('#n').value,descr:$('#d').value,price:$('#p').value,cat:$('#c').value,img:$('#i').value,active:ed?ed.active:true});ed=null;start()};
const tg=async i=>{const x=D.find(z=>z.id==i);await api('dish',{...x,active:!x.active});start()};
const ss=async()=>{const b={};['name','whatsapp','fee','min','hours','banner','logo','open'].forEach(k=>b[k]=$('#s_'+k).value);await api('settings',b);start();alert('Guardado')};
K?start().catch(()=>{}):login();
</script></body></html>
