<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Panel de administración</title>
<style>
:root{--bg:#0d0e11;--panel:#17191f;--panel2:#20232b;--line:#30343e;--text:#f6f7fb;--muted:#9ca3af;--orange:#f97316;--orange2:#fb923c;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#392314 0,transparent 34%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;transition:.18s}button:active{transform:scale(.97)}.shell{max-width:1200px;margin:auto;padding:24px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--orange2),#ea580c);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 25px #f9731630}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--orange2);font-weight:900}.brand h1{font-size:21px;margin:3px 0 0;letter-spacing:-.6px}.topright{display:flex;align-items:center;gap:9px}.live{font-size:12px;color:#86efac;background:#14532d55;border:1px solid #166534;padding:8px 11px;border-radius:30px}.logout,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px;font-weight:750}.btn.primary{background:linear-gradient(110deg,var(--orange2),#ea580c);color:#211006;border:0}.btn.danger{color:#fca5a5;border-color:#7f1d1d;background:#450a0a55}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}.sidebar{align-self:start;position:sticky;top:16px;background:#14161b;border:1px solid var(--line);border-radius:18px;padding:12px}.side-label{color:#697180;font-size:10px;font-weight:900;letter-spacing:.16em;padding:12px 10px 8px}.navbtn{width:100%;border:0;background:transparent;color:#aeb4c0;padding:13px 12px;border-radius:11px;text-align:left;font-weight:750;display:flex;gap:11px;align-items:center;margin:2px 0}.navbtn.active{background:#f973161b;color:#fdba74;box-shadow:inset 3px 0 var(--orange)}.navbtn:hover{background:#ffffff0b}.content{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 20px}.pagehead h2{font-size:25px;margin:0;letter-spacing:-.8px}.pagehead p{margin:6px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.card{background:linear-gradient(145deg,#1b1e25,#15171c);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 10px 25px #0002}.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:27px;margin:10px 0 3px;letter-spacing:-1px}.stat em{font-style:normal;color:#a1a1aa;font-size:11px}.sectiontitle{font-size:15px;font-weight:850;margin:24px 0 12px}.card{margin-bottom:14px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.cardhead b{font-size:15px}.muted{color:var(--muted)}.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed #3b404b;border-radius:15px}.order{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:16px 0;border-bottom:1px solid #ffffff10}.order:last-child{border:0}.order h3{font-size:15px;margin:0 0 5px}.order p{font-size:12px;color:var(--muted);margin:5px 0;line-height:1.55}.pill{display:inline-flex;border:1px solid #f9731640;background:#f9731618;color:#fdba74;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800;margin:3px 4px 2px 0}.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}.smallbtn{border:1px solid var(--line);background:#242832;color:#e5e7eb;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:750}.smallbtn.selected{background:#f97316;color:#211006;border-color:#f97316}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;color:#d5d8df;font-size:12px;font-weight:800;margin:2px 0 7px}.field input,.field textarea,.field select,.search{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:#101217;color:var(--text);outline:none}.field input:focus,.field textarea:focus,.search:focus{border-color:var(--orange)}.field textarea{min-height:80px;resize:vertical}.help{font-size:11px;color:var(--muted);margin-top:6px}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.category-picker{display:flex;flex-wrap:wrap;gap:8px}.catbtn{border:1px solid #414651;background:#20232b;color:#d1d5db;border-radius:30px;padding:9px 14px;font-weight:800;font-size:12px}.catbtn.active{background:#f97316;color:#211006;border-color:#f97316}.catbtn.add{border-style:dashed;color:#fdba74;background:#f973160d}.dishlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dish{display:flex;gap:12px;align-items:center;min-width:0}.dish img{width:76px;height:76px;object-fit:cover;border-radius:12px;background:#292d35}.dishinfo{min-width:0;flex:1}.dishinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dishinfo small{color:var(--muted);display:block;margin-top:5px}.toggle{font-size:11px;color:#86efac}.preview{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:10px}.login{max-width:390px;margin:16vh auto;background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:20px}.login input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#101217;color:white;margin:15px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#252a32;border:1px solid #4b5563;color:white;padding:12px 17px;border-radius:12px;z-index:20;box-shadow:0 12px 35px #0008}.hide{display:none!important}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px}.side-label{display:none}.navbtn{justify-content:center;text-align:center;flex-direction:column;gap:4px;font-size:10px;padding:9px 2px}.navbtn span:first-child{font-size:19px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.shell{padding:15px 12px 50px}.top{align-items:flex-start}.brand h1{font-size:17px}.live{display:none}.logout{padding:9px;font-size:12px}.pagehead h2{font-size:22px}.grid{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.fields,.dishlist{grid-template-columns:1fr}.order{grid-template-columns:1fr}.actions{justify-content:flex-start}.dish img{width:65px;height:65px}}
</style></head><body><div class="shell" id="app"></div><div id="toast" class="toast hide"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');
let K=sessionStorage.k||'',tab='home',D=[],S={},O=[],PROMOS=[],edit=null,selectedCat='Platos',filterCat='Todas',photo='',orderFilter='todos',orderSearch='',promoEdit=null;
const api=async(a,b)=>{const r=await fetch('/api/api?a='+a,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-admin':K},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch{}if(r.status===401){sessionStorage.k=K='';login();throw Error('Sesión finalizada')}if(!r.ok)throw Error(j.error||'Error de servidor');return j};
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),2600)}
function login(){ $('#app').innerHTML='<div class="login"><div class="eyebrow">RESTAURANT ADMIN</div><h2>Bienvenido de nuevo</h2><p class="muted">Inicia sesión para administrar tu restaurante.</p><input id="pw" type="password" placeholder="Contraseña de administrador"><button class="btn primary" style="width:100%" onclick="doLogin()">Entrar al panel →</button></div>';$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}
async function doLogin(){K=$('#pw').value;try{await api('login',{});sessionStorage.k=K;await start()}catch(e){toast('Contraseña incorrecta')}}
async function start(){const m=await api('menu');D=m.dishes||[];S=m.s||{};O=await api('orders');draw()}
const categories=()=>{let a=(S.categories||'Platos,Bebidas').split(',').map(x=>x.trim()).filter(Boolean);D.forEach(x=>{if(x.cat&&!a.includes(x.cat))a.push(x.cat)});return a};
function nav(){return '<header class="top"><div class="brand"><div class="logo">🍽️</div><div><div class="eyebrow">RESTAURANT · CONTROL CENTER</div><h1>Panel de administración</h1></div></div><div class="topright"><span class="live">● Sistema conectado</span><button class="logout" onclick="sessionStorage.clear();K=null;login()">Salir ↗</button></div></header><div class="layout"><aside class="sidebar"><div class="side-label">MENÚ PRINCIPAL</div>'+[['home','▦','Resumen'],['orders','▤','Pedidos'],['dishes','🍔','Platos'],['history','🗓','Historial de pedidos'],['promos','🏷️','Promociones'],['settings','⚙','Ajustes']].map(x=>'<button class="navbtn '+(tab===x[0]?'active':'')+'" onclick="tab=\''+x[0]+'\';draw()"><span>'+x[1]+'</span><span>'+x[2]+'</span></button>').join('')+'</aside><main class="content" id="view"></main></div>'}
function head(t,sub,extra){return '<div class="pagehead"><div><h2>'+t+'</h2><p>'+sub+'</p></div>'+(extra||'')+'</div>'}
function draw(){if(!$('#view'))$('#app').innerHTML=nav();else $('#app').innerHTML=nav();const v=$('#view');if(tab==='home')v.innerHTML=home();if(tab==='orders')v.innerHTML=orders();if(tab==='dishes')v.innerHTML=dishes();if(tab==='promos'){v.innerHTML=promotions();api('promotions').then(x=>{PROMOS=x;if(tab==='promos')$('#view').innerHTML=promotions()}).catch(e=>toast(e.message))}if(tab==='settings')v.innerHTML=settings();if(tab==='history')loadHistory(window.historyMonth||new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'));if(tab==='orders'){clearTimeout(window.refreshOrders);window.refreshOrders=setTimeout(async()=>{if(tab==='orders'){O=await api('orders');draw()}},20000)}}
function home(){let today=new Date().toDateString(),tod=O.filter(o=>new Date(o.created).toDateString()===today),pending=O.filter(o=>!['entregado','cancelado'].includes(o.status)),revenue=tod.filter(o=>o.status!=='cancelado').reduce((a,o)=>a+Number(o.total||0),0);return head('Resumen','Vista general del funcionamiento de tu restaurante.')+'<div class="grid"><div class="stat"><small>Pedidos recibidos</small><strong>'+O.length+'</strong><em>Últimos 100 pedidos</em></div><div class="stat"><small>Pedidos de hoy</small><strong>'+tod.length+'</strong><em>Actividad del día</em></div><div class="stat"><small>Por atender</small><strong>'+pending.length+'</strong><em>Pedidos pendientes</em></div><div class="stat"><small>Ventas de hoy</small><strong>'+money(revenue)+'</strong><em>Sin pedidos cancelados</em></div></div><div class="sectiontitle">Actividad reciente</div><div class="card">'+(O.slice(0,5).map(orderCard).join('')||'<div class="empty">Todavía no hay pedidos.</div>')+'</div><div class="sectiontitle">Accesos rápidos</div><div class="card actions" style="justify-content:flex-start"><button class="btn primary" onclick="tab=\'dishes\';edit=null;draw()">＋ Agregar plato</button><button class="btn" onclick="tab=\'orders\';draw()">Ver pedidos</button><button class="btn" onclick="tab=\'settings\';draw()">Configurar restaurante</button></div>'}
function orderCard(o){let ty={local:'En local',recoger:'Para recoger',delivery:'Delivery'},st={nuevo:'Nuevo',confirmado:'Confirmado',preparando:'En preparación',listo:'Listo','en camino':'En camino',entregado:'Entregado',cancelado:'Cancelado'};return '<div class="order"><div><h3>Pedido #'+o.id+' · '+E(o.name)+'</h3><p>'+E(ty[o.type]||o.type)+' · '+E(o.phone)+' · '+E(o.pay)+'<br>'+(o.items||[]).map(i=>i.q+'× '+E(i.name)).join(' · ')+'<br>'+E(o.address||'')+(o.promo_code?'<br>🏷️ '+E(o.promo_code)+' · Descuento '+money(o.discount):'')+'<br><small>'+new Date(o.created).toLocaleString('es-BR')+'</small></p><span class="pill">'+E(st[o.status]||o.status)+'</span></div><div class="actions"><b>'+money(o.total)+'</b></div></div>'}
function historyPage(){let d=new Date(),month=window.historyMonth||d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return head('Historial de pedidos','Consulta los pedidos archivados por mes.')+'<div class="card"><div class="fields"><div class="field"><label>Selecciona el mes</label><input id="historyMonth" type="month" value="'+month+'" onchange="loadHistory(this.value)"></div><div class="field"><label>Resumen del mes</label><div id="historySummary" class="help">Cargando pedidos...</div></div></div></div><div class="card" id="historyList"><div class="empty">Cargando historial...</div></div>'}
async function loadHistory(month){window.historyMonth=month;let [y,m]=month.split('-').map(Number);let start=new Date(y,m-1,1),end=new Date(y,m,1);try{let url='/api/api?a=history&start='+encodeURIComponent(start.toISOString())+'&end='+encodeURIComponent(end.toISOString());let r=await fetch(url,{headers:{'x-admin':K}}),rows=await r.json();if(!r.ok)throw Error(rows.error||'No se pudo cargar el historial');let total=rows.filter(o=>o.status!=='cancelado').reduce((a,o)=>a+Number(o.total||0),0);$('#historySummary').textContent=rows.length+' pedidos · '+money(total)+' en ventas no canceladas';$('#historyList').innerHTML=rows.map(orderCard).join('')||'<div class="empty">No hay pedidos registrados en este mes.</div>'}catch(e){$('#historyList').textContent=e.message}}
function orders(){let list=O.filter(o=>(orderFilter==='todos'||o.status===orderFilter)&&(!orderSearch||[o.id,o.name,o.phone].join(' ').toLowerCase().includes(orderSearch.toLowerCase())));return head('Pedidos','Gestiona los pedidos desde que llegan hasta que se entregan.')+'<div class="card"><div class="fields"><div class="field"><label>Buscar pedido o cliente</label><input value="'+E(orderSearch)+'" placeholder="Número, nombre o teléfono" oninput="orderSearch=this.value;ordersRefreshList()"></div><div class="field"><label>Filtrar por estado</label><select onchange="orderFilter=this.value;ordersRefreshList()">'+[['todos','Todos'],['nuevo','Nuevos'],['confirmado','Confirmados'],['preparando','En preparación'],['listo','Listos'],['en camino','En camino'],['entregado','Entregados'],['cancelado','Cancelados']].map(x=>'<option value="'+x[0]+'" '+(orderFilter===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div></div><div class="cardhead"><b>'+list.length+' pedidos</b><button class="smallbtn" onclick="refresh()">↻ Actualizar</button></div></div><div class="card">'+(list.map(o=>orderCard(o)+orderActions(o)).join('')||'<div class="empty">No hay pedidos con este filtro.</div>')+'</div>'}
async function orderActions(o){let next={nuevo:['confirmado','Confirmar'],confirmado:['preparando','Comenzar preparación'],preparando:['listo','Marcar listo'],listo:['en camino','Enviar'], 'en camino':['entregado','Marcar entregado']}[o.status];return '<div class="actions" style="justify-content:flex-start;margin:0 0 14px">'+(next?'<button class="smallbtn selected" onclick="setStatus('+o.id+',\''+next[0]+'\')">✓ '+next[1]+'</button>':'')+(!['entregado','cancelado'].includes(o.status)?'<button class="smallbtn" onclick="setStatus('+o.id+',\'cancelado\')">Cancelar pedido</button>':'')+'</div>'}
function ordersRefreshList(){if(tab==='orders')$('#view').innerHTML=orders()}
function refresh(){try{O=await api('orders');draw();toast('Pedidos actualizados')}catch(e){toast(e.message)}}
async function setStatus(id,status){try{await api('status',{id,status});O=await api('orders');draw();toast('Estado actualizado')}catch(e){toast(e.message)}}
function dishes(){let cats=categories(),list=D.filter(x=>filterCat==='Todas'||x.cat===filterCat);return head('Platos del menú','Crea, edita, oculta o elimina productos.','<button class="btn" onclick="addCategory(false)">＋ Nueva categoría</button> <button class="btn primary" onclick="edit=null;selectedCat=categories()[0]||\'Platos\';draw()">＋ Nuevo plato</button>')+'<div class="card"><div class="cardhead"><b>Filtrar por categoría</b><span class="muted">'+D.length+' productos</span></div><div class="category-picker"><button class="catbtn '+(filterCat==='Todas'?'active':'')+'" onclick="filterCat=\'Todas\';draw()">Todas</button>'+cats.map(c=>'<button class="catbtn '+(filterCat===c?'active':'')+'" onclick="filterCat=\''+E(c)+'\';draw()">'+E(c)+'</button>').join('')+'<button class="catbtn add" onclick="addCategory(false)">＋ Agregar categoría</button></div></div>'+(edit!==null?dishForm(): '<div class="dishlist">'+list.map(x=>'<div class="card dish"><img src="'+E(x.img||'')+'" onerror="this.style.visibility=\'hidden\'"><div class="dishinfo"><b>'+E(x.name)+'</b><small>'+E(x.cat)+' · '+money(x.price)+'</small><small class="toggle">'+(x.active?'● Visible en menú':'○ Oculto')+'</small><div class="actions" style="justify-content:flex-start;margin-top:8px"><button class="smallbtn" onclick="edit='+x.id+';selectedCat=\''+E(x.cat)+'\';draw()">Editar</button><button class="smallbtn" onclick="toggleDish('+x.id+')">'+(x.active?'Ocultar':'Mostrar')+'</button><button class="smallbtn" onclick="deleteDish('+x.id+')">Eliminar</button></div></div></div>').join('')+'</div>')}
function dishForm(){let x=D.find(z=>z.id===edit)||{};return '<div class="card"><div class="cardhead"><b>'+(x.id?'Editar plato':'Nuevo plato')+'</b><button class="smallbtn" onclick="edit=null;draw()">Cerrar ✕</button></div><div class="fields"><div class="field full"><label>Nombre del plato</label><input id="dn" value="'+E(x.name||'')+'" placeholder="Ej. Pollo broaster"></div><div class="field full"><label>Descripción</label><textarea id="dd" placeholder="Describe el plato...">'+E(x.descr||'')+'</textarea></div><div class="field"><label>Precio (R$)</label><input id="dp" type="number" min="0" step=".01" value="'+(x.price??'')+'"></div><div class="field"><label>Imagen del plato</label><input id="df" type="file" accept="image/*" onchange="readDishPhoto(this)"><div class="help">Opcional · máximo 8 MB</div></div><div class="field full"><label>Selecciona una categoría</label><div class="category-picker">'+categories().map(c=>'<button type="button" class="catbtn '+(selectedCat===c?'active':'')+'" onclick="selectedCat=\''+E(c)+'\';draw()">'+E(c)+'</button>').join('')+'<button type="button" class="catbtn add" onclick="addCategory(true)">＋ Agregar categoría</button></div></div><div class="field full"><img id="dpv" class="preview '+(x.img?'':'hide')+'" src="'+E(x.img||'')+'"></div></div><div class="formactions"><button class="btn primary" onclick="saveDish()">Guardar plato</button><button class="btn" onclick="edit=null;draw()">Cancelar</button></div></div>'}
function cats(){return head('Categorías','Organiza el menú por secciones. Las categorías se guardan para reutilizarlas.')+'<div class="card"><div class="cardhead"><b>Categorías disponibles</b><button class="btn primary" onclick="addCategory(false)">＋ Agregar categoría</button></div><div class="category-picker">'+categories().map(c=>'<span class="catbtn">'+E(c)+' <small style="opacity:.7">('+D.filter(x=>x.cat===c).length+')</small></span>').join('')+'</div><p class="help">Las categorías con productos se mantienen disponibles. Puedes asignarlas desde el formulario de cada plato.</p></div><div class="sectiontitle">Productos por categoría</div>'+categories().map(c=>'<div class="card"><div class="cardhead"><b>'+E(c)+'</b><span class="pill">'+D.filter(x=>x.cat===c).length+' platos</span></div>'+(D.filter(x=>x.cat===c).map(x=>'<div class="order"><div><b>'+E(x.name)+'</b><p>'+money(x.price)+'</p></div><button class="smallbtn" onclick="filterCat=\''+E(c)+'\';tab=\'dishes\';edit=null;draw()">Ver platos</button></div>').join('')||'<span class="muted">Todavía no hay platos en esta categoría.</span>')+'</div>').join('')}
async function addCategory(fromForm){let name=prompt('Nombre de la nueva categoría:');if(!name)return;name=name.trim().replace(/,/g,' ');if(!name)return;if(categories().some(c=>c.toLowerCase()===name.toLowerCase()))return toast('Esa categoría ya existe');let a=categories();a.push(name);try{await api('settings',{categories:a.join(',')});S.categories=a.join(',');selectedCat=name;if(fromForm){edit=edit===null?null:edit;draw()}else draw();toast('Categoría agregada')}catch(e){toast(e.message)}}
function promotions(){return head('Promociones','Crea y administra códigos de descuento.','<button class="btn primary" onclick="promoEdit=null;promoFormPage()">＋ Nueva promoción</button>')+'<div class="card">'+(PROMOS.map(p=>'<div class="order"><div><h3>'+E(p.title)+' · '+E(p.code)+'</h3><p>'+(p.kind==='percent'?p.value+'%':money(p.value))+' de descuento · Compra mínima '+money(p.min_total)+'</p><span class="pill">'+(p.active?'Activa':'Pausada')+'</span></div><div class="actions"><button class="smallbtn" onclick="promoEdit='+p.id+';promoFormPage()">Editar</button><button class="smallbtn" onclick="togglePromo('+p.id+')">'+(p.active?'Pausar':'Activar')+'</button><button class="smallbtn" onclick="deletePromo('+p.id+')">Eliminar</button></div></div>').join('')||'<div class="empty">No hay promociones creadas.</div>')+'</div>'}
function promoFormPage(){let p=PROMOS.find(x=>x.id===promoEdit)||{};$('#view').innerHTML=head(p.id?'Editar promoción':'Nueva promoción','Configura el descuento y su vigencia.')+'<div class="card"><div class="fields"><div class="field"><label>Nombre</label><input id="pr_title" value="'+E(p.title||'')+'"></div><div class="field"><label>Código</label><input id="pr_code" value="'+E(p.code||'')+'" placeholder="BIENVENIDO10"></div><div class="field"><label>Tipo</label><select id="pr_kind"><option value="percent" '+(p.kind!=='fixed'?'selected':'')+'>Porcentaje</option><option value="fixed" '+(p.kind==='fixed'?'selected':'')+'>Monto fijo (R$)</option></select></div><div class="field"><label>Valor</label><input id="pr_value" type="number" min=".01" step=".01" value="'+(p.value||'')+'"></div><div class="field"><label>Compra mínima (R$)</label><input id="pr_min" type="number" min="0" step=".01" value="'+(p.min_total||0)+'"></div><div class="field"><label>Estado</label><select id="pr_active"><option value="1" '+(p.active!==false?'selected':'')+'>Activa</option><option value="0" '+(p.active===false?'selected':'')+'>Pausada</option></select></div><div class="field"><label>Inicio opcional</label><input id="pr_start" type="datetime-local" value="'+(p.starts_at?new Date(p.starts_at).toISOString().slice(0,16):'')+'"></div><div class="field"><label>Vencimiento opcional</label><input id="pr_end" type="datetime-local" value="'+(p.ends_at?new Date(p.ends_at).toISOString().slice(0,16):'')+'"></div></div><p class="help">El servidor valida el cupón y calcula el descuento al confirmar el pedido.</p><div class="formactions"><button class="btn primary" onclick="savePromo()">Guardar</button><button class="btn" onclick="promoEdit=null;draw()">Cancelar</button></div></div>'}
async function savePromo(){let b={id:promoEdit||undefined,title:$('#pr_title').value,code:$('#pr_code').value,kind:$('#pr_kind').value,value:$('#pr_value').value,min_total:$('#pr_min').value,active:$('#pr_active').value==='1',starts_at:$('#pr_start').value?new Date($('#pr_start').value).toISOString():null,ends_at:$('#pr_end').value?new Date($('#pr_end').value).toISOString():null};try{await api('promotion',b);PROMOS=await api('promotions');promoEdit=null;draw();toast('Promoción guardada')}catch(e){toast(e.message)}}
async function togglePromo(id){let p=PROMOS.find(x=>x.id===id);try{await api('promotion',{...p,active:!p.active});PROMOS=await api('promotions');draw();toast('Promoción actualizada')}catch(e){toast(e.message)}}
async function deletePromo(id){if(!confirm('¿Eliminar esta promoción?'))return;try{await api('delpromotion',{id});PROMOS=await api('promotions');draw();toast('Promoción eliminada')}catch(e){toast(e.message)}}
function settings(){let keys=[['name','Nombre del restaurante'],['whatsapp','WhatsApp con código de país'],['fee','Costo de delivery (R$)'],['min','Pedido mínimo (R$)'],['hours','Horario de atención'],['address','Dirección del restaurante'],['deliveryText','Información de delivery']];return head('Ajustes','Configura la información que ven tus clientes.')+'<div class="card"><div class="cardhead"><b>Información general</b></div><div class="fields">'+keys.map(k=>'<div class="field '+(['address','deliveryText'].includes(k[0])?'full':'')+'"><label>'+k[1]+'</label><input id="s_'+k[0]+'" value="'+E(S[k[0]]||'')+'"></div>').join('')+'<div class="field"><label>Estado del restaurante</label><select id="s_open"><option value="1" '+(S.open!=='0'?'selected':'')+'>Abierto · Recibe pedidos</option><option value="0" '+(S.open==='0'?'selected':'')+'>Cerrado</option></select></div><div class="field"><label>Servicio de delivery</label><select id="s_delivery"><option value="1" '+(S.delivery!=='0'?'selected':'')+'>Disponible</option><option value="0" '+(S.delivery==='0'?'selected':'')+'>No disponible</option></select></div><div class="field"><label>Banner del inicio</label><input id="s_banner" type="file" accept="image/*" onchange="readSettingPhoto(this,\'banner\')"><img class="preview '+(S.banner?'':'hide')+'" id="pv_banner" src="'+E(S.banner||'')+'"></div><div class="field"><label>Logo</label><input id="s_logo" type="file" accept="image/*" onchange="readSettingPhoto(this,\'logo\')"><img class="preview '+(S.logo?'':'hide')+'" id="pv_logo" src="'+E(S.logo||'')+'"></div></div><div class="formactions"><button class="btn primary" onclick="saveSettings()">Guardar ajustes</button></div></div>'}
let settingPhotos={banner:'',logo:''};
async function readDishPhoto(input){let f=input.files[0];if(!f)return;if(f.size>8*1024*1024)return toast('La imagen supera 8 MB');photo=await compress(f,1000);$('#dpv').src=photo;$('#dpv').classList.remove('hide')}
async function readSettingPhoto(input,k){let f=input.files[0];if(!f)return;if(f.size>8*1024*1024)return toast('La imagen supera 8 MB');settingPhotos[k]=await compress(f,1400);$('#pv_'+k).src=settingPhotos[k];$('#pv_'+k).classList.remove('hide')}
function compress(f,max){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}
async function saveDish(){let name=$('#dn').value.trim(),price=Number($('#dp').value);if(!name||!price||price<0)return toast('Completa nombre y precio');try{await api('dish',{id:edit||undefined,name,descr:$('#dd').value,price,cat:selectedCat||'Platos',img:photo||(D.find(x=>x.id===edit)||{}).img||'',active:(D.find(x=>x.id===edit)||{}).active!==false});edit=null;photo='';await start();toast('Plato guardado correctamente')}catch(e){toast(e.message)}}
async function toggleDish(id){let x=D.find(z=>z.id===id);try{await api('dish',{...x,active:!x.active});await start();toast('Menú actualizado')}catch(e){toast(e.message)}}
async function deleteDish(id){if(!confirm('¿Eliminar este plato definitivamente?'))return;try{await api('deldish',{id});await start();toast('Plato eliminado')}catch(e){toast(e.message)}}
async function saveSettings(){let b={};['name','whatsapp','fee','min','hours','address','deliveryText','open','delivery'].forEach(k=>b[k]=$('#s_'+k).value);b.banner=settingPhotos.banner||S.banner||'';b.logo=settingPhotos.logo||S.logo||'';try{await api('settings',b);settingPhotos={banner:'',logo:''};await start();toast('Ajustes guardados')}catch(e){toast(e.message)}}
